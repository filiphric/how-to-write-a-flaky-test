name: Rebuild slides collection

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: rebuild-slides-collection
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger slides.filiphric.com
        env:
          DEPLOY_HOOK: ${{ secrets.SLIDES_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo 'Set the SLIDES_DEPLOY_HOOK repository secret before enabling this workflow.' >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 --retry-delay 2 \
            --connect-timeout 10 --max-time 30 --request POST \
            --output /dev/null "$DEPLOY_HOOK"
